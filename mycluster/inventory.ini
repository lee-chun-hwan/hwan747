# javis (실제 hostname: jabis)  - control plane + etcd + worker(파드 스케줄 가능)
# javis2 (실제 hostname: jabis2) - worker
[kube_control_plane]
jabis ansible_connection=local ansible_python_interpreter=/usr/bin/python3.14 ansible_host=192.168.122.1 ip=192.168.122.1 access_ip=192.168.122.1 etcd_member_name=etcd1

[etcd:children]
kube_control_plane

[kube_node]
jabis
jabis2 ansible_python_interpreter=/usr/bin/python3.14 ansible_host=192.168.122.137 ip=192.168.122.137 access_ip=192.168.122.137

[k8s_cluster:children]
kube_control_plane
kube_node
