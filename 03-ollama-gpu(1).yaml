# ============================================================
# 03-ollama-gpu.yaml  (Ubuntu 26.04 + k3s/kubeadm, RTX 5060 8GB 기준)
# Ollama LLM 서버를 GPU로 실행하는 K8s 배포
# 전제: 02 스크립트 완료 (노드 GPU=1, RuntimeClass nvidia 존재)
# 적용:  kubectl apply -f 03-ollama-gpu.yaml
# 접속:  http://<노드IP>:31434   (Open WebUI: http://<노드IP>:30080)
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: llm
---
# 모델 파일 저장 (단일 노드용 hostPath — 재배포해도 모델 유지)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: ollama-models-pv
spec:
  capacity:
    storage: 100Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /var/lib/ollama
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: llm
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: manual
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: llm
spec:
  replicas: 1
  strategy:
    type: Recreate            # GPU 1장이라 동시에 2개 못 띄움
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      runtimeClassName: nvidia
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0"
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"          # 모델을 VRAM에 유지하는 시간
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
          resources:
            limits:
              nvidia.com/gpu: 1
              memory: "24Gi"        # 32GB 시스템 기준 (CPU 오프로드 여유)
            requests:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
          readinessProbe:
            httpGet: { path: /, port: 11434 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: llm
spec:
  type: NodePort
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
      nodePort: 31434
---
# 배포 직후 모델을 자동으로 받아오는 Job (모델명은 MODEL 값만 바꾸면 됨)
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull-model
  namespace: llm
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: curlimages/curl:latest
          env:
            - name: MODEL
              value: "qwen3:8b"     # 8GB VRAM에 들어가는 모델. gpt-oss:20b도 가능(일부 CPU로 넘어가 느림)
          command: ["sh", "-c"]
          args:
            - |
              until curl -sf http://ollama.llm.svc:11434/ >/dev/null; do echo "waiting ollama..."; sleep 5; done
              curl -sf http://ollama.llm.svc:11434/api/pull -d "{\"model\":\"$MODEL\",\"stream\":false}"
              echo "pulled $MODEL"
---
# (선택) 웹 채팅 UI
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: llm
spec:
  replicas: 1
  selector:
    matchLabels: { app: open-webui }
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          ports:
            - containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: "http://ollama.llm.svc:11434"
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          hostPath:
            path: /var/lib/open-webui
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: llm
spec:
  type: NodePort
  selector: { app: open-webui }
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
